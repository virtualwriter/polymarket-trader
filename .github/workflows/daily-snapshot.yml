name: Daily Market Snapshot

on:
  schedule:
    # 9:00 AM ET (14:00 UTC) every day
    - cron: "0 14 * * *"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Take daily snapshot
        run: npx tsx scripts/market-scanner.ts --snapshot

      - name: Commit and push CSV updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily-valuations.csv data/daily-macro.csv
          if git diff --cached --quiet; then
            echo "No changes to commit (snapshot already exists for today)"
          else
            git commit -m "daily snapshot $(date -u +%Y-%m-%d)"
            git push
          fi
