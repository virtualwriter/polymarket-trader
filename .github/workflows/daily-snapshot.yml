name: Market Scanner & Trading Engine

on:
  schedule:
    # Every hour at minute 27 so stops and marks are checked frequently while avoiding top-of-hour scheduler congestion.
    - cron: "27 * * * *"
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate required secrets
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Missing required secret ANTHROPIC_API_KEY"
            exit 1
          fi

      - name: Take market snapshot
        run: npx tsx scripts/market-scanner.ts --snapshot

      - name: Run trading engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/trading-engine.ts

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in data/daily-valuations.csv data/daily-macro.csv \
                   data/trades-detailed.csv data/position-snapshots.csv \
                   data/instrument-snapshots.jsonl data/portfolio.json \
                   data/signal-weights.json data/hypotheses.json \
                   data/learning-params.json \
                   data/blocked-signals.json \
                   data/learning-journal.md; do
            [ -f "$f" ] && git add -f "$f"
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scan+trade $(date -u +%Y-%m-%d-%H%M) [skip ci]"
            git push
          fi
