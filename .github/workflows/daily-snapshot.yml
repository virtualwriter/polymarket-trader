name: Market Scanner & Trading Engine

on:
  schedule:
    # Every 4 hours at minute 0: 1AM, 5AM, 9AM, 1PM, 5PM, 9PM ET
    - cron: "0 5,9,13,17,21,1 * * *"
  workflow_dispatch: # manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  scan-and-trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Take market snapshot
        run: npx tsx scripts/market-scanner.ts --snapshot

      - name: Run trading engine
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx scripts/trading-engine.ts

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/daily-valuations.csv data/daily-macro.csv \
                     data/trades.csv data/portfolio.json \
                     data/signal-weights.json data/hypotheses.json \
                     data/learning-journal.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "scan+trade $(date -u +%Y-%m-%d-%H%M)"
            git push
          fi
